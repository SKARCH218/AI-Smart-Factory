<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Maintenance</title>
</head>
<body>
    <h1>예측 유지보수</h1>

    <!-- 사용 시작 날짜 입력 -->
    <label for="startDate">사용 시작 날짜:</label>
    <input type="date" id="startDate" name="startDate" required><br><br>

    <!-- 숫돌 선택 드롭다운 -->
    <label for="wheel-choice">숫돌을 선택하세요:</label>
    <select id="wheel-choice" name="wheel-choice">
        <option value="1">A숫돌</option>
        <option value="2">WA숫돌</option>
        <option value="3">C숫돌</option>
        <option value="4">GC숫돌</option>
    </select><br><br>

    <!-- 예측 버튼 -->
    <button onclick="predictMaintenance()">예측하기</button>

    <!-- 예측 결과 출력 -->
    <h2>예측 결과:</h2>
    <div id="result"></div>

    <script>
        function predictMaintenance() {
            // 입력된 날짜와 숫돌 정보를 가져옴
            const startDate = document.getElementById('startDate').value;
            const wheel = parseInt(document.getElementById('wheel-choice').value);

            // 입력 값 확인
            if (!startDate || wheel < 1 || wheel > 4) {
                alert('올바른 값을 입력하세요.');
                return;
            }

            // 서버로 보낼 데이터 생성
            const data = { startDate: startDate, wheel: wheel };

            // 서버로 POST 요청 전송
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)  // JSON으로 데이터 변환
            })
            .then(response => response.json())  // 응답을 JSON으로 파싱
            .then(result => {
                // 결과를 페이지에 표시
                if (result.error) {
                    document.getElementById('result').innerHTML = `오류: ${result.error}`;
                } else {
                    document.getElementById('result').innerHTML = 
                        `남은 수명: ${result.remaining_lifetime ? Math.floor(result.remaining_lifetime) + ' 일' : 'N/A'}<br>
                        예상 교체일: ${result.expected_replacement_date}`;
                }
            })
            .catch(error => console.error('오류:', error));
        }
    </script>
</body>
</html>
